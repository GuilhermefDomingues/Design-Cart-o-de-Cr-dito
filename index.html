<!DOCTYPE html>
<!-- Coding by CodingLab | www.codinglabweb.com-->
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="description" content="Design Cartão de Crédito">
    <meta name="keywords" content="Card, Portifolio">
    <meta name="author" content="Guilherme Domingues">
    <meta name="robots" content="Index, follow">
    <title>Design Cartão de Crédito</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <span class="logo">
          <img src="img/logo.png" alt="" />
          <h5>Master Card</h5>
        </span>
        <img src="img/chip.png" alt="" class="chip" />
      </header>

      <div class="card-details">
        <div class="name-number">
          <h6>Numero do Cartão</h6>
          <h5 class="number">0000 0000 0000 0000</h5>
          <h5 class="name">Guilherme Domingues</h5>
        </div>
        <div class="valid-date">
          <h6>Data de Validade</h6>
          <h5>05/30</h5>
        </div>
      </div>
    </div>
  </body>
</html>
